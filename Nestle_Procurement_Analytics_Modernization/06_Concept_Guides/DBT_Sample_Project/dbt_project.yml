name: 'procurement_analytics'
version: '1.0.0'
config-version: 2

# Must match the profile name in ~/.dbt/profiles.yml (see Guide 01, section 4)
profile: 'procurement_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  procurement_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: analytics
